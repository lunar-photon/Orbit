<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html, body, #map { margin: 0; height: 100%; background: #1a1d22; }
  .leaflet-container { font: 12px system-ui, sans-serif; }
  .tag { background: rgba(13, 15, 18, 0.88); color: #ECEEF1; border: 0; border-radius: 8px; padding: 3px 8px;
    font: 600 12px system-ui, sans-serif; box-shadow: none; }
  .tag::before { display: none; }
  .apart { background: rgba(13, 15, 18, 0.88); color: #A6AEBB; border: 0; border-radius: 8px; padding: 2px 7px;
    font: 500 11px system-ui, sans-serif; box-shadow: none; }
  .apart::before { display: none; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #A6AEBB;
    font: 14px system-ui, sans-serif; text-align: center; padding: 24px; z-index: 500; pointer-events: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="empty">Not located yet</div>
<script src="leaflet/leaflet.js"></script>
<script>
  // Orbit's Find my map: the computer (blue) and this phone (green), named, with a line between
  // them and how far apart. Orbit calls show({laptop, phone, apart}); each {lat, lng, acc, label}.
  let cached = null;
  try {
    const raw = localStorage.getItem('orbit_findmap_cache');
    if (raw) cached = JSON.parse(raw);
  } catch (e) {}

  const initLat = (cached && cached.laptop && cached.laptop.lat) ? cached.laptop.lat : 20.6;
  const initLng = (cached && cached.laptop && cached.laptop.lng) ? cached.laptop.lng : 78.9;
  const initZoom = (cached && cached.laptop && cached.laptop.lat) ? 17 : 4;

  const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([initLat, initLng], initZoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  const items = {};
  function place(key, p, colour, radius) {
    if (!p) return null;
    const ll = [p.lat, p.lng];
    let it = items[key];
    if (!it) {
      it = items[key] = {
        ring: L.circle(ll, { radius: p.acc || 20, color: colour, weight: 1, fillColor: colour, fillOpacity: 0.12 }).addTo(map),
        dot: L.circleMarker(ll, { radius, color: '#0D0F12', weight: 3, fillColor: colour, fillOpacity: 1 }).addTo(map)
      };
      it.dot.bindTooltip('', { permanent: true, direction: 'top', offset: [0, -10], className: 'tag' });
    }
    it.ring.setLatLng(ll); it.ring.setRadius(p.acc || 20); it.dot.setLatLng(ll);
    it.dot.setTooltipContent(p.label || '');
    return ll;
  }
  let line = null, fitted = 0;          // how many were in view when it last zoomed to fit
  function show(d) {
    if (d && (d.laptop || d.phone)) {
      try { localStorage.setItem('orbit_findmap_cache', JSON.stringify(d)); } catch (e) {}
    }
    const a = place('laptop', d.laptop, '#8EA8FF', 9), b = place('phone', d.phone, '#46D39A', 7);
    document.getElementById('empty').style.display = (a || b) ? 'none' : 'flex';
    if (a && b) {
      if (!line) {
        line = L.polyline([a, b], { color: '#ECEEF1', weight: 2, opacity: 0.6, dashArray: '4 6' }).addTo(map);
        line.bindTooltip('', { permanent: true, direction: 'center', className: 'apart' });
      }
      line.setLatLngs([a, b]);
      const m = d.apart != null ? d.apart : map.distance(a, b);
      line.setTooltipContent(m < 1000 ? Math.round(m) + ' m apart' : (m / 1000).toFixed(1) + ' km apart');
    }
    const pts = [a, b].filter(Boolean);
    if (pts.length > fitted || d.refit) {
      if (pts.length === 1) map.setView(pts[0], 18);
      else if (pts.length === 2) map.fitBounds(pts, { padding: [50, 50], maxZoom: 19 });
      fitted = pts.length;
    }
  }
  if (cached) show(cached);
</script>
</body>
</html>
