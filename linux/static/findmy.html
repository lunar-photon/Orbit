<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find my phone · Orbit</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/leaflet/leaflet.css">
<style>
  :root {
    --ground: #0D0F12; --surface: #15181D; --raised: #1D2128; --line: #262B33;
    --text: #ECEEF1; --text2: #A6AEBB; --text3: #7D8593;
    --accent: #8EA8FF; --online: #46D39A; --danger: #FF7A7A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Cantarell, Ubuntu, sans-serif; }
  #map { position: fixed; inset: 0; background: #1a1d22; }
  .panel { position: fixed; top: 16px; left: 16px; width: 340px; max-height: calc(100% - 32px); overflow: auto;
    background: rgba(21, 24, 29, 0.96); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    z-index: 1000; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .sub { margin-top: 4px; color: var(--text2); font-size: 13px; line-height: 1.4; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0; }
  .stat { background: var(--raised); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 15px; font-weight: 600; }
  .stat span { font-size: 11px; color: var(--text3); }
  .actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  button { font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--raised);
    border: 1px solid var(--line); border-radius: 12px; height: 44px; cursor: pointer; }
  button:hover { border-color: #3a414c; }
  button.on { background: var(--accent); color: #0D0F12; border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .note { margin-top: 10px; font-size: 12px; color: var(--text2); min-height: 16px; }
  .meter { margin-top: 14px; background: var(--raised); border-radius: 12px; padding: 12px; display: none; }
  .meter.show { display: block; }
  .bar { height: 10px; border-radius: 5px; background: #2a3039; overflow: hidden; margin: 8px 0 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--online); border-radius: 5px; transition: width 0.6s; }
  .meter b { font-size: 15px; }
  h2 { font-size: 13px; color: var(--text2); font-weight: 600; margin: 18px 0 8px; }
  .event { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .event:first-of-type { border-top: none; }
  .event img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
  .event .when { color: var(--text3); font-size: 12px; }
  .empty { color: var(--text3); font-size: 13px; }
  .alert { color: var(--danger); }
  #big { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; align-items: center;
    justify-content: center; z-index: 2000; cursor: zoom-out; }
  #big img { max-width: 92%; max-height: 92%; border-radius: 12px; }
  .leaflet-container { font: inherit; }
  .tag { background: rgba(13, 15, 18, 0.9); color: #ECEEF1; border: 0; border-radius: 8px; padding: 3px 8px; font-weight: 600; box-shadow: none; }
  .tag::before { display: none; }
  @media (max-width: 600px) { .panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 8px; max-height: 55%; } }
</style>
</head>
<body>
<div id="map"></div>

<section class="panel" aria-label="Find my phone">
  <h1 id="title">Find my phone</h1>
  <div class="sub" id="seen">Looking for its last report…</div>

  <div class="stats">
    <div class="stat"><b id="acc">–</b><span>accuracy</span></div>
    <div class="stat"><b id="batt">–</b><span>battery</span></div>
    <div class="stat"><b id="net">–</b><span>network</span></div>
  </div>

  <div class="actions">
    <button id="locate" type="button">Locate now</button>
    <button id="ring" type="button">Play sound</button>
    <button id="nearby" type="button">Nearby</button>
  </div>
  <div class="note" id="note"></div>

  <div class="meter" id="meter" role="status" aria-live="polite">
    <div><b id="meterWord">Asking your phone for its Wi-Fi…</b></div>
    <div class="bar"><i id="meterBar"></i></div>
    <div class="sub" id="meterHint">Your phone sends what Wi-Fi it sees every few seconds: the more it looks like this computer's, the closer it is. No Bluetooth needed.</div>
  </div>

  <h2>Alerts</h2>
  <div id="events"><div class="empty">Nothing unusual. All quiet in orbit.</div></div>
</section>

<div id="big" role="dialog" aria-label="Photo"><img alt="Photo taken after a wrong unlock attempt"></div>

<script src="/leaflet/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([20.6, 78.9], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
map.zoomControl.setPosition('topright');

let dot = null, ring = null, trail = null, centred = false, ringing = false, nearbyOn = false;
let pc = null, pcRing = null, link = null;

function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return new Date(t * 1000).toLocaleString();
}
const reasons = { periodic: 'regular check-in', moved: 'it moved', requested: 'you asked',
  low_battery: 'battery nearly flat: last report before it dies', sim_changed: 'its SIM changed', boot: 'it started up' };

async function api(path, body) {
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, { credentials: 'same-origin', ...opt });
  if (r.status === 401) throw new Error('This page has to be opened from Orbit on this computer.');
  return r.json();
}

function show(v) {
  const last = v.last;
  if (!last) {
    $('seen').textContent = 'No location yet. Turn on "Share location with this computer" in Orbit on the phone.';
  } else {
    $('seen').textContent = 'Seen ' + ago(last.t) + (reasons[last.reason] ? ' · ' + reasons[last.reason] : '');
    $('acc').textContent = last.acc ? Math.round(last.acc) + ' m' : '–';
    $('batt').textContent = last.battery != null ? last.battery + '%' + (last.charging ? ' +' : '') : '–';
    $('net').textContent = last.net || '–';
    const ll = [last.lat, last.lng];
    if (!dot) {
      ring = L.circle(ll, { radius: last.acc || 30, color: '#8EA8FF', weight: 1, fillColor: '#8EA8FF', fillOpacity: 0.12 }).addTo(map);
      dot = L.circleMarker(ll, { radius: 8, color: '#0D0F12', weight: 3, fillColor: '#8EA8FF', fillOpacity: 1 }).addTo(map);
    } else {
      dot.setLatLng(ll); ring.setLatLng(ll); ring.setRadius(last.acc || 30);
    }
    const pts = v.trail.map(p => [p.lat, p.lng]);
    if (trail) trail.setLatLngs(pts);
    else trail = L.polyline(pts, { color: '#8EA8FF', weight: 3, opacity: 0.45, dashArray: '4 6' }).addTo(map);
    dot.bindTooltip('Your phone', { permanent: true, direction: 'top', offset: [0, -10], className: 'tag' });
    // this computer too, where the Wi-Fi map last placed it, and how far apart they are
    const lp = v.laptop;
    if (lp) {
      const pl = [lp.lat, lp.lng];
      if (!pc) {
        pcRing = L.circle(pl, { radius: lp.acc || 30, color: '#46D39A', weight: 1, fillColor: '#46D39A', fillOpacity: 0.1 }).addTo(map);
        pc = L.circleMarker(pl, { radius: 7, color: '#0D0F12', weight: 3, fillColor: '#46D39A', fillOpacity: 1 }).addTo(map);
        pc.bindTooltip('This computer', { permanent: true, direction: 'top', offset: [0, -10], className: 'tag' });
        link = L.polyline([ll, pl], { color: '#ECEEF1', weight: 2, opacity: 0.5, dashArray: '4 6' }).addTo(map);
        link.bindTooltip('', { permanent: true, direction: 'center', className: 'tag' });
      }
      pc.setLatLng(pl); pcRing.setLatLng(pl); pcRing.setRadius(lp.acc || 30); link.setLatLngs([ll, pl]);
      const m = map.distance(ll, pl);
      link.setTooltipContent(m < 1000 ? Math.round(m) + ' m apart' : (m / 1000).toFixed(1) + ' km apart');
    }
    if (!centred) {
      if (lp) map.fitBounds([ll, [lp.lat, lp.lng]], { padding: [80, 80], maxZoom: 18 });
      else map.setView(ll, Math.max(15, Math.min(18, 19 - Math.log2((last.acc || 30) / 10))));
      centred = true;
    }
  }
  // alerts
  const ev = v.events;
  if (ev.length) {
    $('events').innerHTML = '';
    for (const e of ev) {
      const row = document.createElement('div'); row.className = 'event';
      const text = document.createElement('div');
      const what = { sim_changed: 'SIM card changed' + (e.operator ? ' (' + e.operator + ')' : ''),
        sim_removed: 'SIM card removed', wrong_unlock: 'Wrong unlock attempt',
        low_battery: 'Battery nearly flat: last location saved' }[e.kind] || e.kind;
      text.innerHTML = '<div' + (e.kind === 'low_battery' ? '' : ' class="alert"') + '></div><div class="when"></div>';
      text.firstChild.textContent = what; text.lastChild.textContent = ago(e.t);
      if (e.name) {
        const img = document.createElement('img');
        img.src = '/api/findmy/photo?name=' + encodeURIComponent(e.name);
        img.alt = 'Photo from the wrong unlock attempt';
        img.onclick = () => { $('big').firstChild.src = img.src; $('big').style.display = 'flex'; };
        row.appendChild(img);
      }
      row.appendChild(text); $('events').appendChild(row);
    }
  }
  // nearby
  const n = v.nearby || {};
  if (nearbyOn) {
    if (!n.on) {
      nearbyOn = false; $('nearby').classList.remove('on'); $('meter').classList.remove('show');
    } else if (v.bluetooth && v.bluetooth.dbm != null) {
      // Bluetooth (when the phone's is on): signal strength to a rough distance
      const dbm = v.bluetooth.dbm, m = Math.pow(10, (-59 - dbm) / 22);
      $('meterWord').textContent = (m < 1 ? 'Within a metre' : 'About ' + Math.round(m) + ' m') + ' (Bluetooth)';
      $('meterBar').style.width = Math.max(4, Math.min(100, (dbm + 100) * 100 / 55)) + '%';
    } else if (n.score == null) {
      $('meterWord').textContent = 'Asking your phone for its Wi-Fi…';
      $('meterBar').style.width = '0';
    } else {
      $('meterBar').style.width = Math.max(4, Math.min(100, n.score * 100 / 0.7)) + '%';
      $('meterWord').textContent = n.word;
    }
  }
}

async function refresh() {
  try { show(await api('/api/findmy/phone')); }
  catch (e) { $('note').textContent = e.message; }
}

$('locate').onclick = async () => {
  const r = await api('/api/findmy/phone/locate', {});
  $('note').textContent = r.phone_connected ? 'Asked your phone. Its answer usually lands within 30 seconds.'
    : "Your phone isn't connected right now; it reports again when it is.";
};
$('ring').onclick = async () => {
  ringing = !ringing;
  await api('/api/findmy/phone/ring', { on: ringing });
  $('ring').textContent = ringing ? 'Stop sound' : 'Play sound';
  $('ring').classList.toggle('on', ringing);
};
$('nearby').onclick = async () => {
  nearbyOn = !nearbyOn;
  await api('/api/findmy/phone/nearby', { on: nearbyOn });
  $('nearby').classList.toggle('on', nearbyOn);
  $('meter').classList.toggle('show', nearbyOn);
};
$('big').onclick = () => { $('big').style.display = 'none'; };

refresh();
setInterval(() => { refresh(); }, 1000 * 2);
</script>
</body>
</html>
