<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locate · Orbit</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/leaflet/leaflet.css">
<style>
  :root {
    --ground: #0D0F12; --surface: #15181D; --raised: #1D2128; --line: #262B33;
    --text: #ECEEF1; --text2: #A6AEBB; --text3: #7D8593;
    --accent: #8EA8FF; --online: #46D39A; --danger: #FF7A7A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Cantarell, Ubuntu, sans-serif; }
  #map { position: fixed; inset: 0; background: #1a1d22; }
  .panel { position: fixed; top: 16px; left: 16px; width: 340px; max-height: calc(100% - 32px); overflow-y: auto; overflow-x: hidden;
    background: rgba(21, 24, 29, 0.96); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    z-index: 1000; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); transition: width 0.25s ease; }
  .panel.wide { width: 380px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .sub { margin-top: 4px; color: var(--text2); font-size: 13px; line-height: 1.4; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0; }
  .stat { background: var(--raised); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 15px; font-weight: 600; }
  .stat span { font-size: 11px; color: var(--text3); }
  .actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  button { font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--raised);
    border: 1px solid var(--line); border-radius: 12px; height: 44px; cursor: pointer; }
  button:hover { border-color: #3a414c; }
  button.on { background: var(--accent); color: #0D0F12; border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .note { margin-top: 10px; font-size: 12px; color: var(--text2); min-height: 16px; }
  .meter { margin-top: 14px; background: var(--raised); border-radius: 12px; padding: 12px; display: none; }
  .meter.show { display: block; }
  .bar { height: 10px; border-radius: 5px; background: #2a3039; overflow: hidden; margin: 8px 0 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--online); border-radius: 5px; transition: width 0.6s; }
  .meter b { font-size: 15px; }
  h2 { font-size: 13px; color: var(--text2); font-weight: 600; margin: 18px 0 8px; }
  .event { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .event:first-of-type { border-top: none; }
  .event img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
  .event .when { color: var(--text3); font-size: 12px; }
  .empty { color: var(--text3); font-size: 13px; }
  .alert { color: var(--danger); }
  #big { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; align-items: center;
    justify-content: center; z-index: 2000; cursor: zoom-out; }
  #big img { max-width: 92%; max-height: 92%; border-radius: 12px; }
  .leaflet-container { font: inherit; }
  .tag { background: rgba(13, 15, 18, 0.9); color: #ECEEF1; border: 0; border-radius: 8px; padding: 3px 8px; font-weight: 600; box-shadow: none; }
  .tag::before { display: none; }

  /* Segmented tabs matching Orbit styling */
  .tabs { display: flex; background: var(--raised); border-radius: 12px; padding: 3px; gap: 4px; margin-bottom: 16px; border: 1px solid var(--line); }
  .tab-btn { flex: 1; border: none; background: transparent; height: 32px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; transition: all 0.2s; }
  .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

  /* Wi-Fi Lab cards matching rest of interface */
  .lab-card { background: var(--raised); border-radius: 12px; padding: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.04); }
  .lab-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .lab-card-header h3 { font-size: 13px; font-weight: 600; margin: 0; color: var(--text); }
  .lab-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px; background: rgba(255,255,255,0.06); color: var(--text2); }
  .lab-badge.active { background: rgba(70, 211, 154, 0.15); color: var(--online); }
  .lab-badge.alert { background: rgba(255, 122, 122, 0.15); color: var(--danger); }
  .lab-canvas { width: 100%; height: 75px; background: #0D0F12; border-radius: 8px; display: block; border: 1px solid rgba(255,255,255,0.03); }
  .lab-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 11px; color: var(--text3); }
  .lab-val { color: var(--text); font-weight: 600; }

  @media (max-width: 600px) { .panel { left: 8px; right: 8px; width: auto !important; top: auto; bottom: 8px; max-height: 60%; } }

  /* Embedded in-app styling */
  body.embedded {
    background: var(--ground) !important;
    padding: 12px 14px 28px !important;
    height: auto !important;
    min-height: 100vh !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }
  body.embedded #map,
  body.embedded .tabs,
  body.embedded #viewFind {
    display: none !important;
  }
  body.embedded .panel {
    position: static !important;
    width: 100% !important;
    max-width: 100% !important;
    max-height: none !important;
    overflow: visible !important;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    padding: 0 !important;
    box-shadow: none !important;
  }
  body.embedded #viewLab {
    display: block !important;
  }
  body.embedded .lab-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
  }
  body.embedded .lab-canvas {
    height: 85px;
    background: #090B0E;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  /* Full screen enlarged card styling */
  body.has-fullscreen {
    overflow: hidden !important;
  }
  .lab-card-header {
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .lab-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lab-expand-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text2);
    cursor: pointer;
    border-radius: 8px;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all 0.15s;
  }
  .lab-expand-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
  }
  .lab-expand-btn .icon-collapse { display: none; }
  .lab-expand-btn .icon-expand { display: block; }

  .lab-card.fullscreen {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-width: none !important;
    max-height: none !important;
    margin: 0 !important;
    border-radius: 0 !important;
    border: none !important;
    background: var(--ground) !important;
    padding: 16px 16px 36px !important;
    z-index: 99999 !important;
    display: flex !important;
    flex-direction: column !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    box-sizing: border-box !important;
  }
  .lab-card.fullscreen .lab-card-header {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .lab-card.fullscreen .lab-card-header h3 {
    font-size: 17px;
  }
  .lab-card.fullscreen .lab-expand-btn {
    width: 32px;
    height: 32px;
    background: var(--surface);
    border-color: var(--line);
    color: var(--text);
  }
  .lab-card.fullscreen .lab-expand-btn .icon-collapse { display: block; }
  .lab-card.fullscreen .lab-expand-btn .icon-expand { display: none; }

  .lab-card.fullscreen .lab-canvas {
    flex: 0 0 280px;
    height: 280px !important;
    min-height: 280px !important;
    margin: 6px 0 12px;
    border-radius: 12px;
    border-color: rgba(255, 255, 255, 0.08);
  }
  @media (min-height: 800px) {
    .lab-card.fullscreen .lab-canvas {
      flex: 0 0 320px;
      height: 320px !important;
      min-height: 320px !important;
    }
  }

  .lab-fs-back-bar {
    display: none;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .lab-card.fullscreen .lab-fs-back-bar {
    display: flex;
  }
  .lab-fs-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .lab-fs-back-btn:hover {
    background: var(--raised);
    border-color: var(--text3);
  }

  .lab-details {
    display: none;
  }
  .lab-card.fullscreen .lab-details {
    display: block;
    margin-top: 10px;
  }
  .lab-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 8px;
  }
  .lab-metric {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .lab-metric span {
    display: block;
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 3px;
  }
  .lab-metric b {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }
  .lab-top-aps {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .lab-ap-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
  }
  .lab-ap-ssid {
    font-weight: 600;
    color: var(--text);
    max-width: 65%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lab-desc {
    font-size: 11px;
    color: var(--text3);
    margin: 2px 0 8px;
    line-height: 1.35;
  }
  .lab-note-box {
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text2);
    line-height: 1.45;
  }
  .lab-log-section {
    margin-top: 10px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .lab-log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .lab-log-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .lab-log-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--text2);
  }
  .lab-log-badge.has-events {
    background: rgba(255, 122, 122, 0.15);
    color: var(--danger);
  }
  .lab-log-link {
    font-size: 11px;
    color: var(--brand);
    text-decoration: none;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(142, 168, 255, 0.08);
  }
  .lab-log-link:hover {
    text-decoration: underline;
  }
  .lab-log-btn {
    font-size: 11px;
    color: var(--text3);
    background: none;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 7px;
    cursor: pointer;
  }
  .lab-log-btn:hover {
    color: var(--text);
    border-color: var(--text3);
  }
  .lab-log-path {
    font-size: 10px;
    color: var(--text3);
    margin-bottom: 8px;
    word-break: break-all;
  }
  .lab-log-path code {
    color: var(--text2);
    font-family: monospace;
  }
  .lab-log-list {
    max-height: 160px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .lab-card.expanded .lab-log-list {
    max-height: 280px;
  }
  .lab-log-empty {
    font-size: 11px;
    color: var(--text3);
    text-align: center;
    padding: 10px 4px;
    font-style: italic;
  }
  .lab-log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.04);
    font-size: 11px;
  }
  .lab-log-time {
    font-family: monospace;
    font-weight: 600;
    color: var(--text);
    margin-right: 6px;
  }
  .lab-log-spike {
    font-weight: 600;
    color: var(--danger);
    margin-right: 8px;
  }
  .lab-log-meta {
    color: var(--text3);
    font-size: 10px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="map"></div>

<section class="panel" id="panel" aria-label="Locate">
  <div class="tabs">
    <button id="tabFind" type="button" class="tab-btn active" onclick="switchTab('find')">Locate</button>
    <button id="tabLab" type="button" class="tab-btn" onclick="switchTab('lab')">Wi-Fi Lab</button>
  </div>

  <div id="viewFind">
    <h1 id="title">Locate</h1>
    <div class="sub" id="seen">Looking for its last report…</div>

    <div class="stats">
      <div class="stat"><b id="acc">–</b><span>accuracy</span></div>
      <div class="stat"><b id="batt">–</b><span>battery</span></div>
      <div class="stat"><b id="net">–</b><span>network</span></div>
    </div>

    <div class="actions">
      <button id="locate" type="button">Locate now</button>
      <button id="ring" type="button">Play sound</button>
      <button id="nearby" type="button">Nearby</button>
    </div>
    <div class="note" id="note"></div>

    <div class="meter" id="meter" role="status" aria-live="polite">
      <div><b id="meterWord">Asking your phone for its Wi-Fi…</b></div>
      <div class="bar"><i id="meterBar"></i></div>
      <div class="sub" id="meterHint">Your phone sends what Wi-Fi it sees every few seconds: the more it looks like this computer's, the closer it is. No Bluetooth needed.</div>
    </div>

    <h2>Alerts</h2>
    <div id="events"><div class="empty">Nothing unusual. All quiet in orbit.</div></div>
  </div>

  <div id="viewLab" style="display: none; width: 100%; max-width: 580px; margin: 0 auto;">
    <iframe id="labFrame" src="about:blank" style="width:100%;height:calc(100vh - 110px);border:none;border-radius:12px;background:#0D0F12;"></iframe>
  </div>
</section>

<div id="big" role="dialog" aria-label="Photo"><img alt="Photo taken after a wrong unlock attempt"></div>

<script src="/leaflet/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const isEmbedded = location.search.includes('embedded=1') || location.search.includes('app=1');
if (isEmbedded) {
  document.body.classList.add('embedded');
}

const CACHE_KEY = 'orbit_findmy_cache';
function loadCachedLocation() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveCachedLocation(data) {
  try {
    if (data && data.last) {
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    }
  } catch (e) {}
}

let map = null;
const cachedLoc = loadCachedLocation();
const initLat = (cachedLoc && cachedLoc.last && cachedLoc.last.lat) ? cachedLoc.last.lat : 20.6;
const initLng = (cachedLoc && cachedLoc.last && cachedLoc.last.lng) ? cachedLoc.last.lng : 78.9;
const initZoom = (cachedLoc && cachedLoc.last && cachedLoc.last.lat) ? 17 : 4;

if (!isEmbedded && $('map') && typeof L !== 'undefined') {
  try {
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView([initLat, initLng], initZoom);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    map.zoomControl.setPosition('topright');
  } catch (e) {}
}

let dot = null, ring = null, trail = null, centred = false, ringing = false, nearbyOn = false;
let pc = null, pcRing = null, link = null;

function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return new Date(t * 1000).toLocaleString();
}
const reasons = { periodic: 'regular check-in', moved: 'it moved', requested: 'you asked',
  low_battery: 'battery nearly flat: last report before it dies', sim_changed: 'its SIM changed', boot: 'it started up' };

// Signed in by the HttpOnly cookie Orbit set when it opened this page; the key itself never
// sits in the address or in the page's storage.
try { localStorage.removeItem('orbit_ltok'); } catch (e) {}

async function api(path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const opt = body === undefined ? { headers } : { method: 'POST', headers, body: JSON.stringify(body) };
  const r = await fetch(path, { credentials: 'same-origin', ...opt });
  if (r.status === 401) throw new Error('This page has to be opened from Orbit on this computer.');
  return r.json();
}

function show(v) {
  if (v && v.last) saveCachedLocation(v);
  const cached = loadCachedLocation();
  const last = (v && v.last) ? v.last : (cached && cached.last ? cached.last : null);
  if (!last) {
    $('seen').textContent = 'Locating phone…';
  } else {
    $('seen').textContent = 'Seen ' + ago(last.t) + (reasons[last.reason] ? ' · ' + reasons[last.reason] : '');
    $('acc').textContent = last.acc ? Math.round(last.acc) + ' m' : '–';
    $('batt').textContent = last.battery != null ? last.battery + '%' + (last.charging ? ' +' : '') : '–';
    $('net').textContent = last.net || '–';
    if (map) {
      const ll = [last.lat, last.lng];
      if (!dot) {
        ring = L.circle(ll, { radius: last.acc || 30, color: '#8EA8FF', weight: 1, fillColor: '#8EA8FF', fillOpacity: 0.12 }).addTo(map);
        dot = L.circleMarker(ll, { radius: 8, color: '#0D0F12', weight: 3, fillColor: '#8EA8FF', fillOpacity: 1 }).addTo(map);
      } else {
        dot.setLatLng(ll); ring.setLatLng(ll); ring.setRadius(last.acc || 30);
      }
      const rawTrail = (v && v.trail && v.trail.length) ? v.trail : (cached && cached.trail ? cached.trail : []);
      const pts = rawTrail.map(p => [p.lat, p.lng]);
      if (trail) trail.setLatLngs(pts);
      else if (pts.length) trail = L.polyline(pts, { color: '#8EA8FF', weight: 3, opacity: 0.45, dashArray: '4 6' }).addTo(map);
      dot.bindTooltip('Your phone', { permanent: true, direction: 'top', offset: [0, -10], className: 'tag' });
      const lp = (v && v.laptop) ? v.laptop : (cached ? cached.laptop : null);
      if (lp) {
        const pl = [lp.lat, lp.lng];
        if (!pc) {
          pcRing = L.circle(pl, { radius: lp.acc || 30, color: '#46D39A', weight: 1, fillColor: '#46D39A', fillOpacity: 0.1 }).addTo(map);
          pc = L.circleMarker(pl, { radius: 7, color: '#0D0F12', weight: 3, fillColor: '#46D39A', fillOpacity: 1 }).addTo(map);
          pc.bindTooltip('This computer', { permanent: true, direction: 'top', offset: [0, -10], className: 'tag' });
          link = L.polyline([ll, pl], { color: '#ECEEF1', weight: 2, opacity: 0.5, dashArray: '4 6' }).addTo(map);
          link.bindTooltip('', { permanent: true, direction: 'center', className: 'tag' });
        }
        pc.setLatLng(pl); pcRing.setLatLng(pl); pcRing.setRadius(lp.acc || 30); link.setLatLngs([ll, pl]);
        const m = map.distance(ll, pl);
        link.setTooltipContent(m < 1000 ? Math.round(m) + ' m apart' : (m / 1000).toFixed(1) + ' km apart');
      }
      if (!centred) {
        if (lp) map.fitBounds([ll, [lp.lat, lp.lng]], { padding: [80, 80], maxZoom: 18 });
        else map.setView(ll, Math.max(15, Math.min(18, 19 - Math.log2((last.acc || 30) / 10))));
        centred = true;
      }
    }
  }
  // alerts
  const ev = v.events;
  if (ev && ev.length) {
    $('events').innerHTML = '';
    for (const e of ev) {
      const row = document.createElement('div'); row.className = 'event';
      const text = document.createElement('div');
      const what = { sim_changed: 'SIM card changed' + (e.operator ? ' (' + e.operator + ')' : ''),
        sim_removed: 'SIM card removed', wrong_unlock: 'Wrong unlock attempt',
        low_battery: 'Battery nearly flat: last location saved' }[e.kind] || e.kind;
      text.innerHTML = '<div' + (e.kind === 'low_battery' ? '' : ' class="alert"') + '></div><div class="when"></div>';
      text.firstChild.textContent = what; text.lastChild.textContent = ago(e.t);
      if (e.name) {
        const img = document.createElement('img');
        img.src = '/api/findmy/photo?name=' + encodeURIComponent(e.name);
        img.alt = 'Photo from the wrong unlock attempt';
        img.onclick = () => { $('big').firstChild.src = img.src; $('big').style.display = 'flex'; };
        row.appendChild(img);
      }
      row.appendChild(text); $('events').appendChild(row);
    }
  }
  // nearby
  const n = v.nearby || {};
  if (nearbyOn) {
    if (!n.on) {
      nearbyOn = false; $('nearby').classList.remove('on'); $('meter').classList.remove('show');
    } else if (v.bluetooth && v.bluetooth.dbm != null) {
      const dbm = v.bluetooth.dbm, m = Math.pow(10, (-59 - dbm) / 22);
      $('meterWord').textContent = (m < 1 ? 'Within a metre' : 'About ' + Math.round(m) + ' m') + ' (Bluetooth)';
      $('meterBar').style.width = Math.max(4, Math.min(100, (dbm + 100) * 100 / 55)) + '%';
    } else if (n.score == null) {
      $('meterWord').textContent = 'Asking your phone for its Wi-Fi…';
      $('meterBar').style.width = '0';
    } else {
      $('meterBar').style.width = Math.max(4, Math.min(100, n.score * 100 / 0.7)) + '%';
      $('meterWord').textContent = n.word;
    }
  }
}

async function refresh() {
  try { show(await api('/api/findmy/phone')); }
  catch (e) { $('note').textContent = e.message; }
}

async function requestLiveLocation() {
  try {
    $('note').textContent = 'Requesting live location from your phone…';
    const r = await api('/api/findmy/phone/locate', {});
    $('note').textContent = r.phone_connected ? 'Asked your phone for live location. Answer lands within 20-30 seconds.'
      : "Your phone is in standby; requesting live fix as soon as it wakes.";
  } catch (e) {
    if ($('note')) $('note').textContent = e.message;
  }
}

$('locate').onclick = requestLiveLocation;
$('ring').onclick = async () => {
  ringing = !ringing;
  await api('/api/findmy/phone/ring', { on: ringing });
  $('ring').textContent = ringing ? 'Stop sound' : 'Play sound';
  $('ring').classList.toggle('on', ringing);
};
$('nearby').onclick = async () => {
  nearbyOn = !nearbyOn;
  await api('/api/findmy/phone/nearby', { on: nearbyOn });
  $('nearby').classList.toggle('on', nearbyOn);
  $('meter').classList.toggle('show', nearbyOn);
};
$('big').onclick = () => { $('big').style.display = 'none'; };

// ---- Tab Switching ----
let currentTab = 'find';
function switchTab(tab) {
  currentTab = tab;
  $('tabFind').classList.toggle('active', tab === 'find');
  $('tabLab').classList.toggle('active', tab === 'lab');
  $('viewFind').style.display = tab === 'find' ? 'block' : 'none';
  $('viewLab').style.display = tab === 'lab' ? 'block' : 'none';
  $('panel').classList.toggle('wide', tab === 'lab');

  if (tab === 'lab') {
    const frame = $('labFrame');
    if (frame && (!frame.src || frame.src === 'about:blank' || !frame.src.includes('/wifilab'))) {
      frame.src = '/wifilab?embedded=1';
    }
  }
}

if (!isEmbedded) {
  const c = loadCachedLocation();
  if (c) {
    show(c);
  }
  refresh();
  setInterval(refresh, 2000);
  requestLiveLocation();
}

if (location.pathname === '/wifilab' || location.search.includes('tab=lab')) {
  switchTab('lab');
}
</script>
